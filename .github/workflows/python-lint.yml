name: Python Backend Lint

on:
  push:
  pull_request:

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so the workflow can access project files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up the Python runtime used by the backend.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install flake8 as a lightweight linting dependency.
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # E501 stays ignored: the historical line-length policy.
      # W503 stays ignored: this tree breaks before binary operators, which is
      # the current PEP 8 preference and the opposite of W504. Ignoring W503
      # does not disable unused-import, undefined-name, or import-order checks.
      - name: Run flake8
        run: flake8 backend --ignore=E501,W503 --exclude=backend/.venv,backend/.cache
