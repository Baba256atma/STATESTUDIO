name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so the workflow can access project files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up the Python runtime used by the backend.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install backend dependencies only when a requirements file is present.
      - name: Install backend dependencies
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt
          else
            echo "No backend/requirements.txt found. Skipping dependency installation."
          fi

      # Run a basic syntax validation pass against the backend source tree.
      - name: Validate backend Python syntax
        run: python -m compileall backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      # Check out the repository so the workflow can access project files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up the Node.js runtime used by the frontend.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies from the frontend workspace.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # The hosted authorization test shells out to the backend's declared dependencies.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      # Run lint only if the frontend package defines a lint script.
      - name: Run frontend lint
        working-directory: frontend
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script found. Skipping lint."
          fi

      # Full-project TypeScript gate (production + tests). Any diagnostic fails the job.
      - name: Full-project TypeScript typecheck
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run typecheck

      # DEPLOY:5 authentication and workspace isolation. These share the Frontend check.
      - name: Authentication and workspace isolation
        working-directory: frontend
        run: |
          ./node_modules/.bin/tsx --test \
            app/lib/auth/nexoraExecutiveAccess.test.ts \
            app/lib/auth/hostedAuthentication.test.ts \
            app/lib/workspace-auth/hostedLifecycle.test.ts \
            app/lib/workspace-auth/hostedLlmContext.test.ts \
            app/lib/workspace-auth/hostedManagerData.test.ts \
            app/lib/workspace-auth/hostedOperationalPersistence.test.ts \
            app/lib/workspace-auth/hostedProductionConfig.test.ts \
            app/lib/workspace-auth/hostedWorkspaceTransition.test.ts \
            app/lib/workspace-auth/hostedWorkspaceAuthorization.test.ts \
            scripts/renderBuildGate.test.mjs

      # Full Scene runtime suite (Vitest + node:test via pinned jiti). Any failure fails the job.
      - name: Full Scene runtime tests
        working-directory: frontend
        run: npm run test:scene

      # Run build only if the frontend package defines a build script.
      - name: Run frontend build
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi
