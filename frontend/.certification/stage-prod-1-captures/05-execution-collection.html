<!doctype html><html><head><meta charset="utf-8"/><title>Execution Collection</title>
<style>
body{margin:0;background:#0a1018;color:#d7e0ea;font:14px/1.3 ui-sans-serif,system-ui}
.stage{position:relative;width:960px;height:540px;border:1px solid #243044;margin:24px auto;overflow:hidden}
.stage div[data-id]{position:absolute;transform:translate(-50%,-50%);padding:6px 10px;border:1px solid #3a516c;border-radius:4px;background:rgba(12,20,32,.85);font-size:12px;white-space:nowrap}
.queue{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:140px;padding:10px;border-left:1px solid #3a516c;background:rgba(6,10,18,.7)}
.queue h2{margin:0 0 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8aa0b5}
.queue ul{list-style:none;margin:0;padding:0}
.queue li{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.queue li[data-active="true"]{color:#7eb6e8}
.header{position:absolute;left:16px;top:12px;font-size:12px;color:#7eb6e8}
</style></head><body>

<div class="stage" data-mode="collection">

  <div data-id="obj-capacity" data-role="unrelated" data-spatial="watch" style="left:19.700000000000003%;top:46.78%;">Capacity</div>
<div data-id="obj-risk" data-role="unrelated" data-spatial="watch" style="left:80%;top:48.18%;">Risk</div>
<div data-id="e1" data-role="related" data-spatial="collection" style="left:35.45%;top:38.31%;">e1</div>
<div data-id="e2" data-role="related" data-spatial="collection" style="left:63.95%;top:38.31%;">e2</div>
<div data-id="e3" data-role="related" data-spatial="collection" style="left:35.45%;top:56.51%;">e3</div>
<div data-id="e4" data-role="related" data-spatial="collection" style="left:63.95%;top:56.51%;">e4</div>
  <aside class="queue"><h2>Executive Queue</h2><ul><li data-category="problem" data-active="false">problem 3</li><li data-category="scenario" data-active="false">scenario 5</li><li data-category="decision" data-active="false">decision 2</li><li data-category="execution" data-active="true">execution 4</li></ul></aside>
</div>
</body></html>
